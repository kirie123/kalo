[package]
name = "kalo"
version = "0.1.0"
description = "Kalo - AI coding agent desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pdf-extract = "0.9"
calamine = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }
