name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 仓库级机器检查（契约漂移 + 行数 ratchet）
  machine-checks:
    name: Machine checks (contract + length ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-file-length.mjs --strict
      - run: node scripts/check-bridge-contract.mjs

  # 前端类型检查 + 单测（纯逻辑层）
  desktop-ts:
    name: Desktop TS (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalo-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kalo-desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Rust 后端检查（src-tauri）
  #
  # 双平台矩阵：根 AGENTS.md 的「Windows / macOS 双平台等价契约」要求 sidecar
  # 命名等平台相关逻辑两侧都成立。macOS job 会真正跑 sidecar.rs 的单测，挡住
  # 「又把某个平台的二进制文件名写死进代码」这类回归。
  desktop-rust:
    name: Desktop Rust (check + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: kalo-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kalo-desktop/src-tauri
          key: ${{ matrix.os }}
      - run: cargo check
      - run: cargo test
