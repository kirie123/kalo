name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 前端类型检查 + 单测（纯逻辑层）
  desktop-ts:
    name: Desktop TS (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalo-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kalo-desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Rust 后端检查（src-tauri）
  desktop-rust:
    name: Desktop Rust (check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalo-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kalo-desktop/src-tauri
      - run: cargo check
      - run: cargo test --no-run

  # 引擎侧 lint + 类型检查（vendored pi，跑上游 check 的子集，避免重依赖）
  harness-check:
    name: Harness check (biome + tsgo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalo-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kalo-harness/package-lock.json
      - run: npm ci
      - run: npx biome check --error-on-warnings . || true
      - run: npx tsgo --noEmit
