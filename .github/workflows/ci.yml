name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 仓库级机器检查（契约漂移 + 行数 ratchet）
  machine-checks:
    name: Machine checks (contract + length ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-file-length.mjs --strict
      - run: node scripts/check-bridge-contract.mjs

  # 前端类型检查 + 单测（纯逻辑层）
  desktop-ts:
    name: Desktop TS (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalo-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kalo-desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Rust 后端检查（src-tauri）
  desktop-rust:
    name: Desktop Rust (check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalo-desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kalo-desktop/src-tauri
      - run: cargo check
      - run: cargo test --no-run
