# ---------------------------------------------------------------------------
# 五、个股：group=stock
#
# 与 macro 组的形状不同——这些源返回的是**表**（K 线、解禁记录、公告清单），
# 不是标量快照，所以由 fetch_rows() 整段取出交给 stock.py 计算，
# 不走 fields 抽取器。这里登记的是 URL、请求头、限流等级与实测证据。
#
# URL 占位符（由 stock.py 按代码算好传入）：
#   {code}      6 位代码            600519
#   {secid}     东财 secid          1.600519（1=沪 0=深）
#   {secucode}  东财 SECUCODE       600519.SH
#   {tencent}   腾讯/新浪前缀代码    sh600519
#   {orgid}     巨潮 orgId          gssh0600519
# ---------------------------------------------------------------------------

- id: stock_kline
  name: 个股日线(前复权)
  group: stock
  kind: http
  url: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param={tencent},day,,,{days},qfq"
  rate: normal
  ttl: 3600
  parse:
    type: json
    rows: "data.{tencent}.qfqday"
  probe_with: { code: "600519", days: "10" }
  # 走腾讯而不是东财：push2his 实测反复整体限流（连代理也拒），腾讯与新浪
  # 在同一时刻正常。选 qfq(前复权) 是必须的——分红除权会在不复权序列上
  # 造出假跳空，MA/MACD 全废。新浪那条（CN_MarketData.getKLineData）
  # 只有不复权，只能当备份。
  # 每行：[日期, 开, 收, 高, 低, 成交量(手)]
  verified_at: "2026-08-20"
  verified_sample: "['2026-08-20','1299.80','1291.50','1306.88','1291.00','25332']"

- id: stock_quote
  name: 个股实时快照
  group: stock
  kind: http
  url: "https://qt.gtimg.cn/q={tencent}"
  encoding: gbk
  rate: normal
  ttl: 300
  parse:
    type: text
  probe_with: { code: "600519" }
  # ~ 分隔的 88 段。实测过的段位：1 名称 2 代码 3 现价 4 昨收 5 今开
  # 6 成交量(手) 31 涨跌额 32 涨跌幅% 37 成交额(万) 38 换手率%
  # 39 市盈率 44 流通市值(亿) 45 总市值(亿) 46 市净率
  fields:
    name: { index: 1, sep: "~" }
    price: { index: 3, sep: "~", digits: 2 }
    prev_close: { index: 4, sep: "~", digits: 2 }
    chg_pct: { index: 32, sep: "~", digits: 2 }
    turnover_rate: { index: 38, sep: "~", digits: 2 }
    pe: { index: 39, sep: "~", digits: 2 }
    float_cap_yi: { index: 44, sep: "~", digits: 2 }
    total_cap_yi: { index: 45, sep: "~", digits: 2 }
    pb: { index: 46, sep: "~", digits: 2 }
  verified_at: "2026-08-20"
  verified_sample: 'v_sh600519="1~贵州茅台~600519~1291.50~1307.88~1299.80~25332~...";'

