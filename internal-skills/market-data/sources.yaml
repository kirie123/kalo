- id: global_index
  name: 纳指标普恒生
  group: macro
  kind: http
  url: "https://hq.sinajs.cn/list=int_nasdaq,int_sp500,int_hangseng"
  encoding: gbk
  headers:
    Referer: "https://finance.sina.com.cn"
  rate: normal
  ttl: 600
  parse:
    type: text
  # 格式：var hq_str_int_nasdaq="名称,点位,涨跌额,涨跌幅";
  fields:
    nasdaq: { regex: 'int_nasdaq="[^,]*,([\d.]+)', digits: 2 }
    nasdaq_chg_pct: { regex: 'int_nasdaq="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
    sp500: { regex: 'int_sp500="[^,]*,([\d.]+)', digits: 2 }
    sp500_chg_pct: { regex: 'int_sp500="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
    hsi: { regex: 'int_hangseng="[^,]*,([\d.]+)', digits: 2 }
    hsi_chg_pct: { regex: 'int_hangseng="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
  verified_at: "2026-08-20"
  verified_sample: 'var hq_str_int_nasdaq="纳斯达克,22484.07,99.37,0.44";'

# ---------------------------------------------------------------------------
# 四、A股自身
#
# ⚠ 实测教训：A股指数原本用东财 push2.eastmoney.com/api/qt/ulist.np，
# 开发当天被该域整体限流（连接直接 RemoteDisconnected，curl 与 requests
# 同样中招，换 UA 无效，持续数小时）。同一时刻 hq.sinajs.cn / push2ex /
# datacenter 全部正常。
#
# 结论：**最关键的指标不要单一依赖 push2**。A股指数改走新浪简版行情，
# 与 dxy / commodities 同一个 host（已反复验证稳定）。push2 的接口留在
# 注释里备查，将来做个股体检需要日 K 线时仍会用到，届时必须靠缓存把请求
# 次数压到每天一次。
#
# 备用（限流恢复后可用）：
#   https://push2.eastmoney.com/api/qt/ulist.np/get?fields=f2,f3,f6,f14&secids=1.000001,0.399001,0.399006
# ---------------------------------------------------------------------------

- id: cn_index
  name: A股三大指数
  group: macro
  kind: http
  url: "https://hq.sinajs.cn/list=s_sh000001,s_sz399001,s_sz399006,s_sh000300"
  encoding: gbk
  headers:
    Referer: "https://finance.sina.com.cn"
  rate: normal
  ttl: 300
  parse:
    type: text
  # 格式：var hq_str_s_sh000001="名称,点位,涨跌额,涨跌幅%,成交量(手),成交额(万元)";
  # 成交额单位是**万元**，转成元要 ×10000（analyze 时按万元口径处理，
  # 这里保持源的原始口径不动，避免两处各转一次）。
  fields:
    sh_index: { regex: 's_sh000001="[^,]*,([\d.]+)', digits: 2 }
    sh_chg_pct: { regex: 's_sh000001="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
    sh_turnover_wan: { regex: 's_sh000001="(?:[^,]*,){5}(-?[\d.]+)', digits: 0 }
    sz_index: { regex: 's_sz399001="[^,]*,([\d.]+)', digits: 2 }
    sz_chg_pct: { regex: 's_sz399001="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
    sz_turnover_wan: { regex: 's_sz399001="(?:[^,]*,){5}(-?[\d.]+)', digits: 0 }
    cyb_index: { regex: 's_sz399006="[^,]*,([\d.]+)', digits: 2 }
    cyb_chg_pct: { regex: 's_sz399006="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
    hs300_index: { regex: 's_sh000300="[^,]*,([\d.]+)', digits: 2 }
    hs300_chg_pct: { regex: 's_sh000300="(?:[^,]*,){3}(-?[\d.]+)', digits: 2 }
  verified_at: "2026-08-20"
  verified_sample: 'var hq_str_s_sh000001="上证指数,3903.7210,9.2986,0.24,5066339,101856835";'

- id: limit_up_pool
  name: 涨停池
  group: macro
  kind: http
  url: "https://push2ex.eastmoney.com/getTopicZTPool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=200&sort=fbt%3Aasc&date={today}"
  rate: strict
  ttl: 1800
  parse:
    type: json
  # tc = 涨停总数；zbc(炸板次数)>0 的个股数由 count_where 派生
  fields:
    limit_up_count: { path: "data.tc" }
  derive:
    - name: broken_board_count
      type: count_where
      rows: "data.pool"
      field: "zbc"
      op: ">"
      value: 0
  verified_at: "2026-08-20"
  verified_sample: '{"data":{"tc":79,"qdate":20260820,"pool":[{"c":"000931","zdp":9.976,"zbc":0,...}]}}'

