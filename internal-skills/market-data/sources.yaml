# 数据源注册表
#
# 一条源 = 一条记录，不是一段代码。加源只需在这里加一段 YAML。
#
# 每条源必须带 verified_at 与 verified_sample：判据是「能不能在本机裸取到」，
# 而不是「文档上写着有没有」。失效时 `md.py probe` 会立刻指出来。
#
# rate 等级（由实测倒逼，见 doc）：
#   strict — push2*.eastmoney.com。连续几十次请求后会整体拒绝服务数分钟，
#            换 UA 无效。必须长 TTL 缓存 + 退避重试。
#   normal — datacenter.eastmoney.com / hq.sinajs.cn / cboe / binance / cninfo。
#            实测在 push2 被限流的同一时刻全部正常。
#
# 字段抽取器四选一（与 gateway/src/feeds.ts 保持同一套心智）：
#   {path: a.b.0.c}      JSON 点号路径，数字段即数组下标
#   {regex: ..., group: 1}  文本首个匹配的第 group 个捕获组
#   {index: 3, sep: ","}    文本按分隔符取第 n 段
#   {const: "上证"}          固定文本
# 数值整形（可选，按序）：scale → digits

# ---------------------------------------------------------------------------
# 一、美元与利率：全球流动性总闸
# ---------------------------------------------------------------------------

- id: dxy
  name: 美元指数
  group: macro
  kind: http
  url: "https://hq.sinajs.cn/list=DINIW"
  encoding: gbk
  headers:
    Referer: "https://finance.sina.com.cn"
  rate: normal
  ttl: 300
  parse:
    type: text
  fields:
    dxy: { index: 1, sep: ",", digits: 4 }
    dxy_prev_close: { index: 5, sep: ",", digits: 4 }
  # 实测：hf_DX / hf_DXY / fx_sdxy / 东财 100.UDI / 100.DXY 全部返回空，
  # 只有无前缀的 DINIW 这一个代码可用。
  verified_at: "2026-08-20"
  verified_sample: 'var hq_str_DINIW="17:13:15,98.6322,98.6322,98.7955,2668,98.8019,98.8958,98.6290,98.6322,美元指数,2026-08-20";'

- id: treasury_yield
  name: 中美国债收益率
  group: macro
  kind: http
  url: "https://datacenter.eastmoney.com/api/data/get?type=RPTA_WEB_TREASURYYIELD&sty=ALL&st=SOLAR_DATE&sr=-1&p=1&ps=1"
  rate: normal
  ttl: 3600
  parse:
    type: json
    rows: "result.data"
    row: 0
  # 字段是东财内部代号，不是可读名。实测对照：
  #   EMG* = 美国   EMM* = 中国
  fields:
    yield_date: { path: "SOLAR_DATE" }
    us2y: { path: "EMG00001306" }
    us5y: { path: "EMG00001308" }
    us10y: { path: "EMG00001310" }
    us30y: { path: "EMG00001312" }
    cn2y: { path: "EMM00588704" }
    cn5y: { path: "EMM00166462" }
    cn10y: { path: "EMM00166466" }
    cn30y: { path: "EMM00166469" }
  verified_at: "2026-08-20"
  verified_sample: '{"SOLAR_DATE":"2026-08-19 00:00:00","EMM00166466":1.6831,"EMG00001310":4.65,...}'

