# ---------------------------------------------------------------------------
# 二、商品与经济动能
# ---------------------------------------------------------------------------

- id: commodities
  name: 纽约金银铜油
  group: macro
  kind: http
  url: "https://hq.sinajs.cn/list=hf_GC,hf_SI,hf_HG,hf_CL"
  encoding: gbk
  headers:
    Referer: "https://finance.sina.com.cn"
  rate: normal
  ttl: 300
  parse:
    type: text
  # 一次请求四行，每行 var hq_str_hf_XX="当前价,,买,卖,最高,最低,时间,昨结,开盘,..."
  fields:
    gold: { regex: 'hq_str_hf_GC="([\d.]+)', digits: 2 }
    silver: { regex: 'hq_str_hf_SI="([\d.]+)', digits: 3 }
    copper: { regex: 'hq_str_hf_HG="([\d.]+)', digits: 2 }
    oil: { regex: 'hq_str_hf_CL="([\d.]+)', digits: 2 }
  verified_at: "2026-08-20"
  verified_sample: 'var hq_str_hf_GC="4545.196,,4546.000,...,纽约黄金,0";'

